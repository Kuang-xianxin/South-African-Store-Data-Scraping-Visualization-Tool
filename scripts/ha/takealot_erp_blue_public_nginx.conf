# BLUE only; Nginx proxies bodies and the loopback service selects a verified node.
log_format takealot_blue_performance escape=json
    '{"timestamp":"$msec","path":"$uri","status":$status,'
    '"seconds":$request_time,"bytes":$body_bytes_sent,'
    '"upstream":"$upstream_addr","upstream_seconds":"$upstream_response_time"}';
upstream takealot_blue_main_web {
    server 127.0.0.1:18505;
    keepalive 8;
    keepalive_timeout 2s;
}
upstream takealot_blue_laptop_web {
    server 127.0.0.1:18506;
    keepalive 8;
    keepalive_timeout 2s;
}
map $blue_selected_node $blue_web_upstream {
    default takealot_blue_laptop_web;
    main takealot_blue_main_web;
    laptop takealot_blue_laptop_web;
}
server {
    listen 10.1.0.12:8443 ssl http2;
    server_name 119.91.117.232;
    # No query strings, cookies, client addresses or response bodies.
    access_log /var/log/nginx/takealot-blue-perf.jsonl takealot_blue_performance;
    ssl_certificate /etc/letsencrypt/live/119.91.117.232/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/119.91.117.232/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TakealotERPBlueSSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Takealot-Environment "blue-stage-$blue_selected_node" always;
    add_header Set-Cookie $blue_route_cookie always;
    location = /__blue_route {
        internal;
        proxy_pass http://127.0.0.1:18504/route;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $blue_original_method;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }
    location ^~ /__blue/ { return 404; }
    # Full refresh and serial search analysis can outlast the ordinary five-minute response window.
    location ~ ^/api/erp/(refresh|search-ranking/[^/]+/(analyze|title-review))$ {
        set $blue_original_method $request_method;
        auth_request /__blue_route;
        auth_request_set $blue_selected_node $upstream_http_x_blue_node;
        auth_request_set $blue_route_cookie $upstream_http_set_cookie;
        auth_request_set $blue_revision $upstream_http_x_blue_revision;
        proxy_pass http://$blue_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Blue-Revision $blue_revision;
        include /etc/takealot-blue-routing-proxy.conf;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 3700s;
        proxy_buffering off;
    }
    location / {
        set $blue_original_method $request_method;
        auth_request /__blue_route;
        auth_request_set $blue_selected_node $upstream_http_x_blue_node;
        auth_request_set $blue_route_cookie $upstream_http_set_cookie;
        auth_request_set $blue_revision $upstream_http_x_blue_revision;
        proxy_pass http://$blue_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Blue-Revision $blue_revision;
        include /etc/takealot-blue-routing-proxy.conf;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
