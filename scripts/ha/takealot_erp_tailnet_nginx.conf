# Production green only, over the main host's direct encrypted SSH tunnel.
# The listener is loopback-only; keep Tailscale to the SAME green ERP as backup.
upstream takealot_erp_ha {
    zone takealot_erp_ha 64k;
    server 127.0.0.1:18503 max_fails=1 fail_timeout=5s;
    server 100.70.103.11:8501 backup;
    keepalive 16;
}

server {
    listen 127.0.0.1:18501;
    server_name _;

    location / {
        proxy_pass http://takealot_erp_ha;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffering off;
    }
}
