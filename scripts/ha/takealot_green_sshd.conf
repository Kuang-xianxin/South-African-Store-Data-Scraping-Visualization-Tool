# Dedicated production green reverse tunnel; existing SSH users are unchanged.
AllowUsers takealot-green
Match User takealot-green
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitListen 127.0.0.1:18503
    PermitOpen none
    GatewayPorts no
    X11Forwarding no
    PermitTTY no
    MaxSessions 0
    ClientAliveInterval 10
    ClientAliveCountMax 3
Match all
