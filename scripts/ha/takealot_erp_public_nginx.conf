# Public HTTPS entry for the production Takealot ERP.
#
# Tencent maps 119.91.117.232 to eth0 (10.1.0.12).  Bind only eth0 so this
# listener does not collide with Tailscale Serve on 100.72.100.10:443.
server {
    listen 10.1.0.12:443 ssl http2;
    server_name 119.91.117.232;

    access_log /var/log/nginx/takealot-green-perf.jsonl takealot_green_performance;

    ssl_certificate /etc/letsencrypt/live/119.91.117.232/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/119.91.117.232/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TakealotERPSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://takealot_erp_ha;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_buffering off;
    }
}
