[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takealot-ops"
version = "0.1.0"
description = "Windows-local, read-only Takealot operations dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.116",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "playwright>=1.45",
    "plotly>=5.23",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "streamlit>=1.37",
    "tzdata>=2024.1",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
takealot-ops = "takealot_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
